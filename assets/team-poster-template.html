<!DOCTYPE html>
<html lang="zh-CN" data-canvas-width="1080" data-canvas-height="1440" style="width:1080px;height:1440px;">
<head>
<meta charset="UTF-8">
<title>团队形象海报模板（可编辑）</title>
<!--
  ============================================================
  使用说明（运营替换时只动下面两类，版式/配色已锁定，不要改样式）
  ------------------------------------------------------------
  1) 换人物照片：
     每个 <figure class="card"> 内有一张空 <img class="card-img">。
     把照片地址填到 src="" 里即可，例如 src="photo-01.jpg"；
     填好后占位轮廓会自动隐藏。照片建议：黑色系商务正装、半身、正面或微侧。
  2) 换文案：
     直接改对应节点里的文字，不要删节点本身。
     - 中部大标题：<h1 class="brand-title">
     - 标题下英文：<p class="brand-en">
     - 左右卖点：<div class="points"> 内的 <p>
  画布固定 1080×1440（3:4 竖版），导出时按原尺寸截图即可。
  ============================================================
-->
<style>
  @font-face {
    font-family: "Source Han Sans SC VF";
    src: url("https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/infinite-canvas/fonts/v1/source-han-sans-sc-vf/source-han-sans-sc-vf.otf") format("opentype");
    font-weight: 250 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/infinite-canvas/fonts/v1/montserrat/montserrat-regular.ttf") format("truetype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/infinite-canvas/fonts/v1/montserrat/montserrat-semi-bold.ttf") format("truetype");
    font-weight: 600; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Montserrat";
    src: url("https://lf-flow-web-cdn.doubao.com/obj/flow-doubao/doubao/infinite-canvas/fonts/v1/montserrat/montserrat-bold.ttf") format("truetype");
    font-weight: 700; font-style: normal; font-display: swap;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1440px; background: var(--bg); }

  :root {
    --bg: #F5F3F0;
    --card: #FFFFFF;
    --line: #E7E4DF;
    --ink: #1C1B1A;
    --ink-2: #4A463F;
    --ink-3: #8A857D;
    --ph-bg: #EFEDE9;
    --ph-line: #D6D2CB;
    --ph-text: #B7B2AA;
    --accent: #B82E28;
    --letter: #E4E1DB;
  }

  main {
    position: relative;
    width: 1080px;
    height: 1440px;
    background: var(--bg);
    overflow: hidden;
    font-family: "Source Han Sans SC VF", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
  }

  /* ---------- 人物照片卡片（坐标内联在各卡片上） ---------- */
  .card {
    position: absolute; z-index: 2;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    overflow: hidden; box-shadow: 0 10px 24px rgba(60, 50, 40, 0.06);
  }
  .card-img {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  /* 填了 src 后自动隐藏占位 */
  .card-img[src]:not([src=""]) ~ .ph { display: none; }

  .ph {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: var(--ph-bg);
  }
  .ph svg { width: 74px; height: 74px; }
  .ph-no {
    font-family: "Montserrat", sans-serif; font-weight: 600;
    font-size: 22px; letter-spacing: 0.12em; color: var(--ph-text);
  }
  .ph-tip { font-size: 18px; color: var(--ph-text); letter-spacing: 0.08em; }

  /* ---------- 穿插的字母方块（装饰，无需改动） ---------- */
  .letter {
    position: absolute; z-index: 1;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-family: "Montserrat", sans-serif; font-weight: 800;
    font-size: 130px; line-height: 1; color: var(--letter);
    user-select: none;
  }

  /* ---------- 中部标题带 ---------- */
  .title-band {
    position: absolute; left: 40px; right: 40px; top: 600px; height: 180px; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .brand-title {
    font-weight: 900; font-size: 118px; line-height: 1.1;
    color: var(--accent); letter-spacing: 0.04em; text-align: center;
  }
  .brand-en {
    margin-top: 18px;
    font-family: "Montserrat", sans-serif; font-weight: 600;
    font-size: 24px; letter-spacing: 0.4em; color: var(--ink-3); text-align: center;
  }

  .points { position: absolute; top: 50%; transform: translateY(-50%); }
  .points-left  { left: 0;  text-align: left; }
  .points-right { right: 0; text-align: right; }
  .points p { font-size: 26px; font-weight: 400; line-height: 1.8; color: var(--ink-2); }
</style>
</head>
<body style="width:1080px;height:1440px;">

  <!-- ============ 下组：人物 06–10 + 字母 D / O / I / A ============ -->

</html>
